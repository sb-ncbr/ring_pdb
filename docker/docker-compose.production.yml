name: ringweb

services:
  api:
    restart: always

  web:
    volumes:
      - ./nginx.production.conf:/etc/nginx/nginx.conf:ro
      - /etc/letsencrypt/live/ringweb.biodata.ceitec.cz/fullchain.pem:/etc/fullchain.pem:ro
      - /etc/letsencrypt/live/ringweb.biodata.ceitec.cz/privkey.pem:/etc/privkey.pem:ro
    ports:
      - "80:80"
      - "443:443"
    restart: always
