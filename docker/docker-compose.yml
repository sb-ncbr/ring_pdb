name: ringweb

services:
  api:
    build:
      context: ..
      dockerfile: api/Dockerfile
    container_name: api
    environment:
      FLASK_DEBUG: 1
      PATH_TO_DATA: "/data/rings.parquet"
    volumes:
      - ${RINGWEB_DATA:-/data}:/data:ro
    ports:
      - "5000:5000"
    networks:
      - ringweb-network

  web:
    container_name: web
    build:
      context: ..
      dockerfile: docker/Dockerfile
    ports:
      - "5173:5173"
    develop:
      watch:
        - action: sync
          path: ../frontend
          target: /app
        - action: rebuild
          path: ../frontend/package.json
    networks:
      - ringweb-network

networks:
  ringweb-network:
    driver: bridge
