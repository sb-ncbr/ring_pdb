name: ringweb

services:
  api:
    build: ../api
    container_name: api
    command: flask run --host 0.0.0.0 --port 8000
    environment:
      FLASK_APP: app.py
    volumes:
      - ${RINGWEB_DATA:-/data}:/data:ro
    logging:
      driver: journald
      options:
        tag: ringweb-api

  web:
    container_name: web
    build:
      context: ..
      dockerfile: ./docker/Dockerfile
    volumes:
      - ./nginx.devel.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - api
    ports:
      - "${RINGWEB_PORT:-80}:80"
    logging:
      driver: journald
      options:
        tag: ringweb-web