name: ringpdb

services:
  api:
    build:
      context: ..
      dockerfile: api/Dockerfile.production
    container_name: api
    environment:
      PATH_TO_DATA: "/data/rings.parquet"
    ports:
      - "5000:5000"
    networks:
      - ringpdb-network

  web:
    container_name: web
    build:
      context: ..
      dockerfile: docker/Dockerfile.production
    volumes:
      - ./nginx.devel.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - api
    ports:
      - "${RINGPDB_PORT:-80}:80"
    networks:
      - ringpdb-network

networks:
  ringpdb-network:
    driver: bridge
