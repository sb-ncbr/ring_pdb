name: ringweb

services:
  api:
    build:
      context: ..
      dockerfile: api/Dockerfile
    container_name: api
    environment:
      FLASK_ENV: production
      PATH_TO_DATA: "/data/rings.parquet"
    volumes:
      - ${RINGWEB_DATA:-/data}:/data:ro
    ports:
      - "5000:5000"
    networks:
      - ringweb-network

  web:
    container_name: web
    build:
      context: ..
      dockerfile: docker/Dockerfile.production.local
    volumes:
      - ./nginx.devel.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - api
    ports:
      - "${RINGWEB_PORT:-80}:80"
    networks:
      - ringweb-network

networks:
  ringweb-network:
    driver: bridge