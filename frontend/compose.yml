services:
  api:
    container_name: ring-web-api
    build: ./api/
    ports:
      - "5000:5000"
    develop:
      watch:
        - action: sync
          path: ./api/
          target: .
        - action: rebuild
          path: ./api/requirements.txt
    restart: always
    networks:
      - ring-web-network

  frontend:
    container_name: ring-web-frontend
    build: .
    ports:
      - "5173:5173"
    develop:
      watch:
        - action: sync
          path: .
          target: .
        - action: rebuild
          path: ./package.json
    restart: always
    networks:
      - ring-web-network

networks:
  ring-web-network:
    driver: bridge
